<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sbcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b30"/>
      <stop offset="100%" stop-color="#142c4c"/>
    </linearGradient>
    <linearGradient id="sbcAvatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sbcBgGrad)"/>

  <!-- Subtle institutional grid pattern -->
  <circle cx="200" cy="110" r="68" fill="#002d56" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.5"/>

  <!-- Student Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="94" r="30" fill="url(#sbcAvatarGrad)"/>
  <!-- Torso & College Uniform Polo -->
  <path d="M144 162 C144 134, 172 130, 200 130 C228 130, 256 134, 256 162 C256 170, 252 174, 244 174 L156 174 C148 174, 144 170, 144 162 Z" fill="url(#sbcAvatarGrad)"/>
  
  <!-- College ID Lanyard & Badge -->
  <path d="M190 130 L195 150 L205 150 L210 130" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <rect x="193" y="148" width="14" height="20" rx="2" fill="#0284c7"/>
  <rect x="195" y="150" width="10" height="5" rx="1" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Verification Camera Icon Badge -->
  <g transform="translate(230, 72)">
    <circle cx="12" cy="12" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <path d="M7 15 L17 15 C17.6 15 18 14.6 18 14 L18 10 C18 9.4 17.6 9 17 9 L15 9 L14 7 L10 7 L9 9 L7 9 C6.4 9 6 9.4 6 10 L6 14 C6 14.6 6.4 15 7 15 Z" fill="#ffffff"/>
    <circle cx="12" cy="12" r="2.5" fill="#0284c7"/>
  </g>

  <!-- Clean Institutional Labels -->
  <text x="200" y="210" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">COLLEGE OF INFORMATION TECHNOLOGY</text>
  <text x="200" y="230" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">STUDENT PHOTO VERIFICATION</text>
  <text x="200" y="254" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Live Capture Image Pending or Purged</text>
</svg>

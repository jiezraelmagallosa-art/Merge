<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Slate Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="85%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Metallic Gold 3D Gradient -->
    <linearGradient id="goldMetallic" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Emerald Verification Green -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="shadowDeep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="neonGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10B981" flood-opacity="0.65" />
    </filter>

    <!-- Shield Clip for Inner Glow -->
    <clipPath id="shieldInnerClip">
      <path d="M512 170 L780 270 C780 540 655 725 512 830 C369 725 244 540 244 270 Z" />
    </clipPath>
  </defs>

  <!-- 1. Squircle Canvas Base (Apple / Android Adaptive Standard) -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)" />

  <!-- 2. Subtle Glassmorphic Outer Rim Highlight -->
  <rect x="12" y="12" width="1000" height="1000" rx="220" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- 3. Ambient Background Tech/Cyber Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="2.5" fill="none">
    <circle cx="512" cy="512" r="390" stroke-dasharray="14 18" />
    <circle cx="512" cy="512" r="445" stroke-dasharray="8 24" stroke-opacity="0.05" />
    <!-- Horizontal & Vertical Crosshairs -->
    <path d="M120 512 H260 M764 512 H904" />
    <path d="M512 120 V220 M512 804 V904" />
    <!-- Circuit nodes -->
    <circle cx="260" cy="512" r="6" fill="#F59E0B" fill-opacity="0.4" />
    <circle cx="764" cy="512" r="6" fill="#10B981" fill-opacity="0.4" />
    <circle cx="512" cy="220" r="5" fill="#FDE047" fill-opacity="0.4" />
  </g>

  <!-- 4. Academic Mortarboard Halo (Crown above Shield) -->
  <g filter="url(#shadowDeep)">
    <!-- Mortarboard Diamond -->
    <polygon points="512,108 676,168 512,228 348,168" fill="url(#goldMetallic)" />
    <!-- Cap Rim Underneath -->
    <path d="M410,192 Q512,230 614,192 V212 Q512,250 410,212 Z" fill="#92400E" opacity="0.8" />
    <!-- Flowing Tassel -->
    <path d="M400,188 Q360,225 372,275" fill="none" stroke="#FDE68A" stroke-width="6" stroke-linecap="round" />
    <circle cx="372" cy="280" r="8" fill="#FDE68A" />
  </g>

  <!-- 5. Main Collegiate Tech Shield Crest -->
  <g filter="url(#shadowDeep)">
    <!-- Outer Shield Bevel Stroke -->
    <path d="M512 165 L795 272 C795 560 662 748 512 856 C362 748 229 560 229 272 Z"
          fill="none" stroke="url(#goldMetallic)" stroke-width="26" stroke-linejoin="round" />
    <!-- Shield Inner Fill -->
    <path d="M512 188 L772 286 C772 546 648 718 512 818 C376 718 252 546 252 286 Z"
          fill="#0B1120" stroke="#FDE047" stroke-width="3" stroke-opacity="0.35" />
  </g>

  <!-- 6. Shield Inner Elements & Ambient Radial Core -->
  <g clip-path="url(#shieldInnerClip)">
    <!-- Ambient Golden Glow behind CIT -->
    <radialGradient id="shieldCenterGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <circle cx="512" cy="460" r="280" fill="url(#shieldCenterGlow)" />

    <!-- Digital Attendee Fingerprint / Scan Arc Lines (Behind Text) -->
    <g fill="none" stroke="#FBBF24" stroke-opacity="0.12" stroke-width="4">
      <path d="M430,350 A100,100 0 0,1 594,350" />
      <path d="M400,380 A140,140 0 0,1 624,380" />
      <path d="M375,410 A175,175 0 0,1 649,410" />
      <path d="M350,440 A210,210 0 0,1 674,440" />
      <path d="M330,470 A240,240 0 0,1 694,470" />
      <path d="M315,500 A265,265 0 0,1 709,500" />
    </g>
  </g>

  <!-- 7. Bold Central "CIT" Monogram -->
  <g filter="url(#shadowDeep)">
    <!-- Letter C -->
    <path d="M376 360 C332 360 298 394 298 438 V492 C298 536 332 570 376 570 H418 V522 H378 C357 522 344 510 344 492 V438 C344 420 357 408 378 408 H418 V360 Z"
          fill="url(#goldMetallic)" />

    <!-- Letter I -->
    <path d="M482 360 H542 V570 H482 Z"
          fill="url(#goldMetallic)" />

    <!-- Letter T -->
    <path d="M578 360 H716 V412 H674 V570 H620 V412 H578 Z"
          fill="url(#goldMetallic)" />

    <!-- Monogram Specular Highlights -->
    <path d="M376 364 H414 V370 H376 C336 370 306 400 304 438" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />
    <path d="M486 364 H538" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />
    <path d="M582 364 H712" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />
  </g>

  <!-- 8. Distinct "ATTENDEE" Pill Badge Ribbon -->
  <g filter="url(#shadowDeep)">
    <!-- Badge Background Plate -->
    <rect x="290" y="596" width="444" height="68" rx="34"
          fill="#0F172A" stroke="url(#goldMetallic)" stroke-width="4" />
    
    <!-- Inner Accent Inset -->
    <rect x="296" y="602" width="432" height="56" rx="28"
          fill="#090D16" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Attendee Silhouette Icon inside Badge (Left) -->
    <g transform="translate(322, 616) scale(0.72)">
      <!-- Attendee Head -->
      <circle cx="20" cy="12" r="10" fill="#F59E0B" />
      <!-- Attendee Shoulders / ID Badge -->
      <path d="M4 36 C4 27 12 24 20 24 C28 24 36 27 36 36 Z" fill="#F59E0B" />
    </g>

    <!-- Crisp "ATTENDEE" Typography -->
    <text x="522" y="642"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
          font-size="34"
          font-weight="900"
          letter-spacing="9"
          text-anchor="middle"
          fill="url(#goldMetallic)">
      ATTENDEE
    </text>

    <!-- Mini Verification Star (Right) -->
    <g transform="translate(684, 622) scale(0.68)">
      <polygon points="12,2 15,9 23,10 17,16 19,23 12,19 5,23 7,16 1,10 9,9" fill="#FDE047" />
    </g>
  </g>

  <!-- 9. Dynamic Verified Attendance Checkmark (Floating & Piercing) -->
  <g filter="url(#emeraldGlow)">
    <!-- Dark Backing Stroke for Pop/Contrast -->
    <path d="M440 700 L525 785 L760 520"
          fill="none"
          stroke="#050811"
          stroke-width="58"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- Vibrant Emerald Body -->
    <path d="M440 700 L525 785 L760 520"
          fill="none"
          stroke="url(#emeraldGrad)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- Checkmark Light Reflection -->
    <path d="M448 698 L525 776 L750 524"
          fill="none"
          stroke="#D1FAE5"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.85" />
  </g>

  <!-- 10. Floating Luminous Checkmark Signal Nodes -->
  <circle cx="770" cy="505" r="12" fill="#34D399" filter="url(#neonGold)" />
  <circle cx="770" cy="505" r="5" fill="#FFFFFF" />

</svg>
